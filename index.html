<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Directory</title>
    <style>
        body { font-family: 'Segoe UI', system-ui; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px; margin: 8px 0; background: #eef; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        li:hover { background: #d0d0ff; }
        .btn-back { display: inline-block; margin-top: 20px; padding: 10px 15px; background: #333; color: white; text-decoration: none; border-radius: 4px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Main Index Page -->
    <div id="index-page" class="container">
        <h1>Item Index</h1>
        <p>Click on an item to view its details.</p>
        <ul id="item-list">
            <!-- Items generated by JavaScript -->
        </ul>
    </div>

    <!-- Item Details Page -->
    <div id="details-page" class="container hidden">
        <h1 id="item-title">Item Title</h1>
        <p id="item-description">Item description goes here.</p>
        <div class="btn-back" onclick="goToIndex()">Back to Index</div>
    </div>

    <script>
        // 1. Data for the 3 items
        const items = [
            { id: 0, name: "JavaScript", description: "A versatile programming language used for web development." },
            { id: 1, name: "HTML", description: "The standard markup language for documents designed to be displayed in a web browser." },
            { id: 2, name: "CSS", description: "A style sheet language used for describing the presentation of a document." }
        ];

        // 2. DOM Elements
        const indexPage = document.getElementById('index-page');
        const detailsPage = document.getElementById('details-page');
        const itemList = document.getElementById('item-list');
        const itemTitle = document.getElementById('item-title');
        const itemDescription = document.getElementById('item-description');

        // 3. Render the Index List
        function renderIndex() {
            itemList.innerHTML = '';
            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name;
                li.onclick = () => goToDetails(item.id);
                itemList.appendChild(li);
            });
        }

        // 4. Navigate to Details Page
        function goToDetails(id) {
            const item = items[id];
            if (item) {
                itemTitle.textContent = item.name;
                itemDescription.textContent = item.description;
                indexPage.classList.add('hidden');
                detailsPage.classList.remove('hidden');
                window.location.hash = `details/${id}`;
            }
        }

        // 5. Navigate to Index Page
        function goToIndex() {
            indexPage.classList.remove('hidden');
            detailsPage.classList.add('hidden');
            window.location.hash = 'index';
        }

        // 6. Handle Browser History (Back/Forward buttons)
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash;
            if (hash.startsWith('#details/')) {
                const id = parseInt(hash.split('/')[1], 10);
                if (!isNaN(id) && id >= 0 && id < items.length) {
                    goToDetails(id);
                }
            } else {
                goToIndex();
            }
        });

        // Initialize App
        if (window.location.hash.startsWith('#details/')) {
            const id = parseInt(window.location.hash.split('/')[1], 10);
            goToDetails(id);
        } else {
            renderIndex();
        }
    </script>
</body>
</html>
