<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .description { font-size: 1.1em; line-height: 1.6; color: #444; }
        .back-link { display: inline-block; margin-top: 20px; text-decoration: none; color: #0066cc; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="item-title">Loading...</h1>
        <div class="meta">Category: <span id="item-category">N/A</span></div>
        <div class="description" id="item-description">Please wait while we load your item details.</div>
        
        <a href="index.html" class="back-link">&larr; Back to Index</a>
    </div>

    <script>
        // JavaScript to handle dynamic content based on the URL parameter
        const params = new URLSearchParams(window.location.search);
        const itemNumber = params.get('item');

        // Mock database of items
        const itemData = {
            "1": {
                title: "Project Apollo",
                category: "Space Exploration",
                description: "Project Apollo was the third United States human spaceflight program carried out by NASA. It succeeded in landing the first humans on the Moon in 1969."
            },
            "2": {
                title: "Web Development",
                category: "Technology",
                description: "Web development involves building and maintaining websites. This covers everything from simple plain text pages to complex web applications, social network apps, and e-commerce business apps."
            },
            "3": {
                title: "Machine Learning",
                category: "Artificial Intelligence",
                description: "Machine learning is a subset of artificial intelligence (AI) that focuses on the use of data and algorithms to imitate the way that humans learn, gradually improving its accuracy."
            }
        };

        // Update the page content if a valid item is found, otherwise show an error
        if (itemNumber && itemData[itemNumber]) {
            const data = itemData[itemNumber];
            document.getElementById('item-title').textContent = data.title;
            document.getElementById('item-category').textContent = data.category;
            document.getElementById('item-description').textContent = data.description;
        } else {
            document.getElementById('item-title').textContent = "Item Not Found";
            document.getElementById('item-category').textContent = "N/A";
            document.getElementById('item-description').textContent = "Sorry, the item you are looking for does not exist.";
        }
    </script>
</body>
</html>
